<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конфигуратор мебели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Светлый "шоурум": сцена слева/сверху, спокойная панель выбора, одна зелёная акцентная краска, зелёный WhatsApp только на отправке */
:root{
  color-scheme: light;
  --bg:#eef0ee; --panel:#fbfbfa; --ink:#1d2321; --muted:#68716d; --line:#dfe3e0;
  --accent:#1f6b57; --accent-soft:#e2efea; --warn:#a85a14; --warn-soft:#fbefdf; --wa:#1faa54;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,11fr) minmax(0,12fr) auto;grid-template-areas:"head" "stage" "panel" "bar"}
@media(min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "stage panel" "stage bar"}
}
header{grid-area:head;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:800;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:8px}
@media(max-width:520px){header .brand small{display:none}header{padding:7px 10px;gap:6px}.ghost{padding:7px 10px;font-size:12.5px}.pill{padding:7px 10px;font-size:12.5px}}
.ghost{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:#fff;white-space:nowrap}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

.stage{grid-area:stage;position:relative;min-height:0;background:linear-gradient(#f4f5f3,#e3e6e3);background-size:cover;background-position:center;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.stage .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(20,30,25,.14);font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.pill.on{background:var(--accent);color:#fff}
.stage .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(29,35,33,.78);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;transition:opacity .4s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.stage .hint.off{opacity:0}
.stage .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-weight:600}

.panel{grid-area:panel;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
@media(min-width:900px){.panel{border-top:0;border-left:1px solid var(--line)}}
.tabs{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:9px 12px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--line);overscroll-behavior:contain}
.sec{display:flex;flex-direction:column;gap:9px}
.sec>h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sec>h3 span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);font-size:13px;text-align:right}
.note{font-size:12.5px;color:var(--muted);margin:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.chip svg{width:34px;height:26px;flex:none}
.shape{flex:1 1 calc(50% - 4px);justify-content:flex-start}
.grp{display:flex;flex-direction:column;gap:7px}
.grp .gh{display:flex;align-items:baseline;gap:8px;font-size:14px}
.grp .gh b{font-weight:700}
.grp .gh small{color:var(--muted);flex:1;min-width:0}
.grp .gh em{font-style:normal;font-weight:700;color:var(--accent);font-size:12px;letter-spacing:.02em;white-space:nowrap}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.15;color:var(--muted);text-align:center;padding:3px 0}
.sw i{width:52px;height:52px;border-radius:13px;border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 0 0 2px #fff;display:block;position:relative}
.sw.on{color:var(--ink);font-weight:700}
.sw.on i{outline:2.5px solid var(--accent);outline-offset:2px}
.sw input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sw .rainbow{background:conic-gradient(#e35d5b,#e6b84a,#7fbf6a,#4aa7c9,#6d6bd1,#c45fb0,#e35d5b)}
.slide{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center}
.slide .lbl{grid-column:1/-1;display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.slide .lbl b{font-variant-numeric:tabular-nums;font-weight:800}
.slide button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent);height:30px;margin:0}
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}
.hcard{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;text-align:left;min-height:52px}
.hcard.on{border-color:var(--accent);background:var(--accent-soft)}
.hcard i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.hcard span{flex:1;min-width:0;font-weight:600;font-size:13.5px;line-height:1.2}
.hcard small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.hcard b{font-size:12.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.info{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.warn ul{margin:4px 0 0;padding-left:18px}
.linkbtn{color:var(--accent);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

.bar{grid-area:bar;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
@media(min-width:900px){.bar{border-left:1px solid var(--line)}}
.bar .price{flex:1;min-width:0}
.bar .price small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .price b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cta{background:var(--accent);color:#fff;font-weight:800;padding:13px 18px;border-radius:13px;font-size:15px;white-space:nowrap}
.cta.wa{background:var(--wa);display:flex;justify-content:center;text-decoration:none;text-align:center}
.cta.sec2{background:var(--accent-soft);color:var(--accent)}

.sheet{position:fixed;inset:0;background:rgba(20,26,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
@media(min-width:700px){.sheet{align-items:center}}
.card{background:var(--panel);width:min(560px,100%);max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){.card{border-radius:20px}}
.card.wide{width:min(760px,100%)}
.card h2{margin:0;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px;text-wrap:balance}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:20px;line-height:1;flex:none}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{padding:11px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;color:var(--ink);font-weight:500;width:100%}
.f textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;max-height:84px;overflow:auto;color:var(--muted)}
.mods{display:flex;flex-direction:column;gap:5px}
.mod{display:grid;grid-template-columns:1fr 84px 36px;gap:6px;align-items:center}
.mod select,.mod input{padding:8px 8px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:14px;width:100%}
.wallbox{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px}
.wallbox .wh{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;gap:8px}
.wallbox .wh span{font-weight:600;color:var(--muted);font-size:12.5px}
.wallbox .wh span.bad{color:var(--warn)}
.shot{width:100%;border-radius:12px;border:1px solid var(--line)}
#sheet .card:not(.wide) .shot.sm{max-height:210px;object-fit:cover}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="../shared/site.css">
<script>window.MEBEL_TOOL = "konfigurator";</script>
<script src="../shared/site.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span id="brand">Мебель на заказ</span><small>конфигуратор</small></div>
    <button class="ghost" id="btnCode">Есть код</button>
    <button class="ghost" id="btnPro">Дизайнеру</button>
  </header>
  <div class="stage" id="stage">
    <div class="load" id="load">Загружаем 3D-модель...</div>
    <div class="tools"><button class="pill hide" id="tOpen">Открыть двери</button><button class="pill hide" id="tPan">Двигать</button><button class="pill" id="tPhoto">Примерить на фото</button><button class="pill" id="tFit">Вернуть вид</button><button class="pill" id="tShot">Картинка</button></div>
    <div class="hint" id="hint">Поверните модель пальцем</div>
    <input type="file" id="photoFile" accept="image/*" class="hide">
  </div>
  <div class="panel">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="body" id="body"></div>
  </div>
  <div class="bar">
    <div class="price"><small id="priceNote">Примерная цена с монтажом</small><b id="price">-</b></div>
    <button class="cta" id="btnSend">Отправить заявку</button>
  </div>
</div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>
<script>
/*!
 * mebel-order.js - общий формат заказа "Мебельный конструктор", версия 1.1
 *
 * Один файл без зависимостей. Работает в браузере (<script src> или вставить целиком
 * в <script> одной HTML-страницы - появится глобальный объект MebelOrder) и в Node (require).
 *
 * Главное:
 *   MebelOrder.create()            - новый пустой заказ с настройками по умолчанию
 *   MebelOrder.parse(text)         - прочитать JSON (в том числе старый расчёт калькулятора)
 *   MebelOrder.validate(order)     - проверка: ошибки и предупреждения по-русски
 *   MebelOrder.migrate(obj)        - привести любой старый вариант к текущей версии
 *   MebelOrder.stringify(order)    - JSON для файла *.mebel.json
 *   MebelOrder.toLink / fromLink   - заказ в ссылке (для WhatsApp)
 *   MebelOrder.forClient(order)    - копия без себестоимости и наценки
 *   MebelOrder.listParts(order)    - все детали заказа плоским списком
 *   MebelOrder.cutList(order)      - список на распил (длина, ширина, текстура, кромка по 4 сторонам)
 *   MebelOrder.facadeList(order)   - фасады по размерам для заказа на фабрике
 *   MebelOrder.bom(order)          - расход материалов, кромки, фурнитуры
 *   MebelOrder.quote(order)        - расчёт цены; recalc(order) записывает его в order.quote
 *   MebelOrder.balance(order)      - оплачено, остаток, расходы, прибыль
 *   MebelOrder.region / setRegion  - страна и валюта мастера (одна настройка на все инструменты)
 *   MebelOrder.money(n, "RUB")     - "354 000 ₽"; moneyWords - сумма прописью в нужной валюте
 *
 * Подробное описание - README.md рядом с этим файлом.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.MebelOrder = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var FORMAT = "mebel-order";
  var VERSION = "1.1";
  var FILE_EXT = ".mebel.json";

  // ---------- Справочники ----------

  var STAGES = [
    { key: "lead", name: "Заявка" },
    { key: "measure", name: "Замер" },
    { key: "design", name: "Проект" },
    { key: "contract", name: "Договор и предоплата" },
    { key: "production", name: "Производство" },
    { key: "install", name: "Доставка и монтаж" },
    { key: "done", name: "Завершён" },
    { key: "cancelled", name: "Отменён" }
  ];

  var PRODUCT_TYPES = { kupe: "Шкаф-купе", kitchen: "Кухня", univ: "Изделие" };

  // Положение детали. Ось в названии - это ось, вдоль которой идёт ТОЛЩИНА листа.
  // a и b - два размера детали; sidesA - стороны, кромка которых идёт вдоль a; sidesB - вдоль b.
  var ORIENT = {
    X: { name: "Вертикальная боковая", a: "Высота", b: "Глубина", sidesA: ["front", "back"], sidesB: ["top", "bottom"] },
    Y: { name: "Горизонтальная", a: "Ширина", b: "Глубина", sidesA: ["front", "back"], sidesB: ["left", "right"] },
    Z: { name: "Фронтальная / задняя", a: "Ширина", b: "Высота", sidesA: ["top", "bottom"], sidesB: ["left", "right"] }
  };
  var SIDE_NAMES = { front: "спереди", back: "сзади", left: "слева", right: "справа", top: "сверху", bottom: "снизу" };

  var ROLES = {
    side: "Боковина", top: "Крыша", bottom: "Дно", shelf: "Полка", partition: "Перегородка",
    back: "Задняя стенка", plinth: "Цоколь", facade: "Фасад", drawer: "Деталь ящика",
    countertop: "Столешница", apron: "Стеновая панель", filler: "Планка / добор", other: "Другое"
  };

  var MATERIAL_KINDS = { sheet: "лист", area: "м2", length: "п.м." };
  var EXTRA_KINDS = { item: "Своя позиция", delivery: "Доставка", install: "Монтаж", service: "Услуга" };
  var PAYMENT_KINDS = { prepay: "Предоплата", payment: "Оплата", refund: "Возврат" };
  var PAYMENT_METHODS = { cash: "Наличные", kaspi: "Kaspi", sbp: "СБП", card: "Карта", transfer: "Перевод на счёт", other: "Другое" };
  var EXPENSE_CATEGORIES = {
    materials: "Плитные материалы", facades: "Фасады", hardware: "Фурнитура", cutting: "Распил и кромление",
    countertop: "Столешница", delivery: "Доставка", install: "Монтаж / сборка", other: "Другое"
  };

  // ---------- Страна и валюта ----------
  // Валюта заказа - order.currency (код ISO 4217), страна - order.country (KZ, RU).
  // Страна задаёт шаблон договора, реквизиты, способы оплаты и НДС по умолчанию; валюта - знак,
  // слова для сумм прописью и шаг округления. Добавить валюту = добавить строку в CURRENCIES.
  // inWord - для фраз "цены в рублях". rateKZT - сколько тенге стоит единица валюты, очень примерно: нужен только чтобы получить
  // стартовые цены там, где нет своего набора. Настоящие цены мастер задаёт сам.
  var CURRENCIES = {
    KZT: { code: "KZT", sign: "₸", name: "Тенге", forms: ["тенге", "тенге", "тенге"], roundTo: 1000, inWord: "тенге", rateKZT: 1 },
    RUB: { code: "RUB", sign: "₽", name: "Рубли", forms: ["рубль", "рубля", "рублей"], roundTo: 100, inWord: "рублях", rateKZT: 6.5 },
    BYN: { code: "BYN", sign: "Br", name: "Белорусские рубли", forms: ["белорусский рубль", "белорусских рубля", "белорусских рублей"], roundTo: 10, inWord: "белорусских рублях", rateKZT: 170 },
    UZS: { code: "UZS", sign: "сум", name: "Сумы", forms: ["сум", "сума", "сумов"], roundTo: 10000, inWord: "сумах", rateKZT: 0.043 },
    KGS: { code: "KGS", sign: "сом", name: "Сомы", forms: ["сом", "сома", "сомов"], roundTo: 100, inWord: "сомах", rateKZT: 6 },
    USD: { code: "USD", sign: "$", name: "Доллары США", forms: ["доллар США", "доллара США", "долларов США"], roundTo: 10, inWord: "долларах США", rateKZT: 520 },
    EUR: { code: "EUR", sign: "€", name: "Евро", forms: ["евро", "евро", "евро"], roundTo: 10, inWord: "евро", rateKZT: 600 }
  };
  // vatPct - ставка НДС с 2026 года (РК - 16%, РФ - 22%). Многие мастера работают без НДС,
  // поэтому в документах по умолчанию "без НДС", ставка подставляется, если мастер плательщик.
  var COUNTRIES = {
    KZ: {
      code: "KZ", name: "Казахстан", currency: "KZT", vatPct: 16, phonePrefix: "7",
      payMethods: ["cash", "kaspi", "card", "transfer", "other"],
      law: "Республики Казахстан"
    },
    RU: {
      code: "RU", name: "Россия", currency: "RUB", vatPct: 22, phonePrefix: "7",
      payMethods: ["cash", "sbp", "card", "transfer", "other"],
      law: "Российской Федерации"
    }
  };
  var DEFAULT_COUNTRY = "KZ";
  var REGION_KEY = "mebel-region";

  function currencyInfo(code) {
    var c = CURRENCIES[String(code || "").toUpperCase()];
    if (c) return c;
    var s = isStr(code) && code ? code.toUpperCase() : "KZT";

        bb.x1 = Math.max(bb.x1, b.x1); bb.y1 = Math.max(bb.y1, b.y1); bb.z1 = Math.max(bb.z1, b.z1);
      }
    });
    if (!bb) return null;
    bb.w = r0(bb.x1 - bb.x0); bb.h = r0(bb.y1 - bb.y0); bb.d = r0(bb.z1 - bb.z0);
    return bb;
  }

  // ---------- Обход деталей ----------

  function eachPart(order, cb) {
    arr(order.products).forEach(function (product) {
      if (!isObj(product)) return;
      arr(product.parts).forEach(function (part, i) { if (isObj(part)) cb({ product: product, module: null, part: part, index: i }); });
      arr(product.modules).forEach(function (module) {
        if (!isObj(module)) return;
        arr(module.parts).forEach(function (part, i) { if (isObj(part)) cb({ product: product, module: module, part: part, index: i }); });
      });
    });
  }
  function listParts(order) { var out = []; eachPart(order, function (e) { out.push(e); }); return out; }

  function eachHardware(order, cb) {
    arr(order.products).forEach(function (product) {
      if (!isObj(product)) return;
      arr(product.hardware).forEach(function (line) { if (isObj(line)) cb({ product: product, module: null, line: line }); });
      arr(product.modules).forEach(function (module) {
        if (!isObj(module)) return;
        arr(module.hardware).forEach(function (line) { if (isObj(line)) cb({ product: product, module: module, line: line }); });
      });
    });
  }

  function findPart(order, id) {
    var found = null;
    eachPart(order, function (e) { if (!found && e.part.id === id) found = e; });
    return found;
  }

  // Маркировка для наклеек: "1.3-07" = изделие 1, модуль 3, деталь 7. Детали без модуля: "1-07".
  function assignMarks(order) {
    arr(order.products).forEach(function (product, pi) {
      var n = 0;
      arr(product.parts).forEach(function (part) { n++; part.mark = (pi + 1) + "-" + ("0" + n).slice(-2); });
      arr(product.modules).forEach(function (module, mi) {
        var k = 0;
        arr(module.parts).forEach(function (part) { k++; part.mark = (pi + 1) + "." + (mi + 1) + "-" + ("0" + k).slice(-2); });
      });
    });
    return order;
  }

  // ---------- Текстура и кромка детали ----------

  // Направление текстуры: "a" - вдоль размера a, "b" - вдоль b, "any" - не важно.
  // Если не указано: у материала без рисунка - "any"; с рисунком - вдоль большей стороны детали.
  function partGrain(part, material) {
    if (part.grain === "a" || part.grain === "b" || part.grain === "any") return part.grain;
    if (!material || !material.grain) return "any";
    return part.a >= part.b ? "a" : "b";
  }

  // Кромка детали по сторонам: { front: {id,name,t,...} | null, ... } - только стороны, которые есть у этого положения.
  function partEdges(order, product, part) {
    var o = ORIENT[part.o], out = {};
    if (!o) return out;
    o.sidesA.concat(o.sidesB).forEach(function (s) {
      var ref = isObj(part.edges) ? part.edges[s] : null;
      out[s] = ref ? getEdge(order, product, ref) : null;
    });
    return out;
  }
  // Длина кромки детали в мм по каждому виду кромки: { pvc04: 1234, ... }
  function partEdgeLength(order, product, part) {
    var o = ORIENT[part.o], out = {};
    if (!o || !isObj(part.edges)) return out;
    for (var s in part.edges) {
      var id = resolveRef(part.edges[s], product);
      if (!id) continue;
      var len = o.sidesA.indexOf(s) >= 0 ? part.a : o.sidesB.indexOf(s) >= 0 ? part.b : 0;
      out[id] = (out[id] || 0) + num(len);
    }
    return out;
  }

  // ---------- Список на распил ----------

  // opts.kinds - какие материалы включать (по умолчанию только листовые: ["sheet"]); opts.group - склеить одинаковые детали.
  // Каждая строка: длина и ширина ГОТОВОЙ детали (с кромкой), cutLength/cutWidth - размер пиления (минус толстая кромка),
  // grain: "length" (текстура вдоль длины) или "any", canRotate, кромка по сторонам L1, L2 (вдоль длины) и W1, W2 (вдоль ширины).
  function cutList(order, opts) {
    opts = opts || {};
    var kinds = opts.kinds || ["sheet"];
    var subtract = !order.production || order.production.subtractEdge !== false;
    var rows = [];
    eachPart(order, function (e) {
      var part = e.part, product = e.product, o = ORIENT[part.o];
      var mat = getMaterial(order, product, part.mat);
      if (!o || !mat || kinds.indexOf(mat.kind) < 0) return;
      if (!(part.a > 0 && part.b > 0)) return;
      var g = partGrain(part, mat);
      var alongA = g === "a" ? true : g === "b" ? false : part.a >= part.b;
      var ed = partEdges(order, product, part);
      var eA = o.sidesA.map(function (s) { return ed[s]; }), eB = o.sidesB.map(function (s) { return ed[s]; });
      var L = alongA ? part.a : part.b, W = alongA ? part.b : part.a;
      var eL = alongA ? eA : eB, eW = alongA ? eB : eA;
      var slim = function (x) { return x ? { id: x.id, name: x.name, t: x.t } : null; };
      var cut = function (x) { return subtract && x && x.t >= 1 ? x.t : 0; };
      rows.push({
        id: part.id,
        mark: part.mark || "",
        name: part.name || "",
        role: part.role || "",
        product: { id: product.id, name: product.name || "" },
        module: e.module ? { id: e.module.id, name: e.module.name || "" } : null,
        material: { id: mat.id, name: mat.name, t: mat.t, decor: mat.decor || "", sheet: mat.sheet ? clone(mat.sheet) : null, grain: !!mat.grain, kind: mat.kind || "", price: num(mat.price, 0) },
        length: L,
        width: W,
        cutLength: r2(L - cut(eW[0]) - cut(eW[1])),
        cutWidth: r2(W - cut(eL[0]) - cut(eL[1])),
        qty: Math.max(1, num(part.qty, 1)) * Math.max(1, num(product.qty, 1)),
        grain: g === "any" ? "any" : "length",
        canRotate: g === "any",
        edges: { L1: slim(eL[0]), L2: slim(eL[1]), W1: slim(eW[0]), W2: slim(eW[1]) },
        note: part.note || ""
      });
    });
    if (!opts.group) return rows;
    var map = {}, out = [];
    rows.forEach(function (r) {
      var ek = ["L1", "L2", "W1", "W2"].map(function (k) { return r.edges[k] ? r.edges[k].id : "-"; }).join(",");
      var key = [r.material.id, r.length, r.width, r.grain, ek].join("|");
      if (map[key]) { map[key].qty += r.qty; map[key].ids.push(r.id); }
      else { var c = clone(r); c.ids = [r.id]; map[key] = c; out.push(c); }
    });
    return out;
  }

  // Список фасадов для заказа на фабрике: по материалу и размеру (ширина x высота), с количеством.
  function facadeList(order) {
    var map = {}, out = [];
    eachPart(order, function (e) {
      var part = e.part;
      if (part.role !== "facade" || !(part.a > 0 && part.b > 0)) return;
      var mat = getMaterial(order, e.product, part.mat);
      if (!mat) return;
      var w = part.o === "X" ? part.b : part.a, h = part.o === "Y" ? part.b : part.o === "X" ? part.a : part.b;
      var q = Math.max(1, num(part.qty, 1)) * Math.max(1, num(e.product.qty, 1));
      var key = mat.id + "|" + w + "|" + h;
      if (map[key]) { map[key].qty += q; map[key].ids.push(part.id); }
      else { map[key] = { material: { id: mat.id, name: mat.name, t: mat.t, decor: mat.decor || "" }, width: w, height: h, qty: q, area: 0, ids: [part.id] }; out.push(map[key]); }
    });
    out.forEach(function (r) { r.area = r2(r.width * r.height / 1e6 * r.qty); });
    return out;
  }

  // ---------- Расход материалов ----------

  function bom(order) {
    var pr = order.pricing || defaultPricing();
    var mats = {}, edges = {}, hw = {}, byProduct = {};
    var pb = function (id) { return byProduct[id] || (byProduct[id] = { materials: {}, edges: {}, hardware: 0 }); };
    eachPart(order, function (e) {
      var part = e.part, product = e.product;
      var mat = getMaterial(order, product, part.mat);
      if (!mat || !(part.a > 0 && part.b > 0)) return;
      var q = Math.max(1, num(part.qty, 1)) * Math.max(1, num(product.qty, 1));
      var m = mats[mat.id] || (mats[mat.id] = { id: mat.id, name: mat.name, kind: mat.kind, price: num(mat.price), count: 0, area: 0, length: 0 });
      var area = part.a * part.b / 1e6 * q, len = Math.max(part.a, part.b) / 1000 * q;
      m.count += q; m.area += area; m.length += len;
      var share = pb(product.id).materials;
      share[mat.id] = (share[mat.id] || 0) + (mat.kind === "length" ? len : area);
      var el = partEdgeLength(order, product, part);
      for (var id in el) {
        var ed = getEdge(order, product, id);
        if (!ed) continue;
        var x = edges[id] || (edges[id] = { id: id, name: ed.name, price: num(ed.price), net: 0 });
        x.net += el[id] / 1000 * q;
        var es = pb(product.id).edges; es[id] = (es[id] || 0) + el[id] / 1000 * q;
      }
    });
    var sheetsCut = 0;
    Object.keys(mats).forEach(function (id) {
      var m = mats[id], src = order.catalog.materials[id];
      m.area = r2(m.area); m.length = r2(m.length);
      if (m.kind === "sheet") {
        var sh = src.sheet || { w: 2800, h: 2070 };
        var use = Math.min(100, Math.max(30, num(src.usagePct, num(pr.sheetUsagePct, 80)))) / 100;
        m.sheets = Math.ceil(m.area / (sh.w * sh.h / 1e6 * use) - 1e-9);
        m.qty = m.sheets; m.unit = "лист";
        if (src.cut) sheetsCut += m.sheets;
      } else if (m.kind === "length") { m.qty = m.length; m.unit = "п.м."; }
      else { m.qty = m.area; m.unit = "м2"; }
      m.sum = r0(m.qty * m.price);
    });
    Object.keys(edges).forEach(function (id) {
      var x = edges[id];
      x.net = r2(x.net);
      x.qty = Math.ceil(x.net * (1 + num(pr.edgeReservePct, 10) / 100) - 1e-9);
      x.unit = "м"; x.sum = r0(x.qty * x.price);
    });
    eachHardware(order, function (e) {
      var h = getHardware(order, e.line);
      var q = h.qty * Math.max(1, num(e.product.qty, 1));
      if (!q) return;
      var key = (h.item || "") + "|" + h.name + "|" + h.price;
      var x = hw[key] || (hw[key] = { item: h.item, name: h.name, unit: h.unit, price: h.price, qty: 0, sum: 0 });
      x.qty = r2(x.qty + q); x.sum = r0(x.qty * x.price);
      pb(e.product.id).hardware += q * h.price;
    });
    return {
      materials: Object.keys(mats).map(function (k) { return mats[k]; }),
      edges: Object.keys(edges).map(function (k) { return edges[k]; }),
      hardware: Object.keys(hw).map(function (k) { return hw[k]; }),
      sheetsCut: sheetsCut,
      cutting: { qty: sheetsCut, unit: "лист", price: num(pr.cutPerSheet), sum: r0(sheetsCut * num(pr.cutPerSheet)) },
      byProduct: byProduct
    };
  }

  // ---------- Цена ----------

  function ceilTo(n, step) { step = Math.max(1, num(step, 1)); return Math.ceil(n / step - 1e-9) * step || 0; }

  // Делит сумму total по долям weights целыми числами, остаток - в самую большую долю.
  function splitSum(total, weights, step) {
    var sum = weights.reduce(function (s, w) { return s + w; }, 0);
    if (!weights.length) return [];
    step = step || 1;
    var out = weights.map(function (w) { return sum > 0 ? Math.floor(total * w / sum / step) * step : 0; });
    var rest = total - out.reduce(function (s, v) { return s + v; }, 0), big = 0;
    weights.forEach(function (w, i) { if (w > weights[big]) big = i; });
    out[big] += rest;
    return out;
  }

  // Расчёт цены по правилам калькулятора. Ничего не меняет в заказе, возвращает объект quote.
  // lines - подробные строки для мастера (себестоимость), clientLines - строки для клиента (КП, договор).
  function quote(order) {
    var pr = order.pricing || defaultPricing(), b = bom(order), lines = [];
    b.materials.forEach(function (m) { if (m.sum > 0) lines.push({ group: "material", ref: m.id, name: m.name + (m.kind === "sheet" ? " (" + m.area + " м2)" : ""), qty: m.qty, unit: m.unit, price: m.price, sum: m.sum }); });
    b.edges.forEach(function (x) { if (x.sum > 0) lines.push({ group: "edge", ref: x.id, name: x.name, qty: x.qty, unit: x.unit, price: x.price, sum: x.sum }); });
    if (b.cutting.sum > 0) lines.push({ group: "cutting", name: "Распил и кромление", qty: b.cutting.qty, unit: "лист", price: b.cutting.price, sum: b.cutting.sum });
    b.hardware.forEach(function (h) { if (h.sum > 0) lines.push({ group: "hardware", ref: h.item || undefined, name: h.name, qty: h.qty, unit: h.unit, price: h.price, sum: h.sum }); });
    var items = [], services = [];
    arr(order.extras).forEach(function (x) {
      if (!isObj(x)) return;
      var sum = r0(num(x.qty, 1) * num(x.price));
      if (!sum) return;
      var line = { group: x.kind && x.kind !== "item" ? "service" : "extra", ref: x.id, name: x.name || EXTRA_KINDS[x.kind] || "Своя позиция", qty: num(x.qty, 1), unit: x.unit || "шт", price: num(x.price), sum: sum };
      lines.push(line);
      (line.group === "service" ? services : items).push(line);
    });

    var servicesSum = services.reduce(function (s, l) { return s + l.sum; }, 0);
    var materials = lines.reduce(function (s, l) { return s + l.sum; }, 0) - servicesSum;
    var work = r0(materials * num(pr.workPct) / 100);
    var cost = materials + work + servicesSum;
    var markup = r0(cost * num(pr.markupPct) / 100);
    var d = Math.min(90, Math.max(0, num(pr.discountPct))) / 100;
    var total = ceilTo((cost + markup) * (1 - d), pr.roundTo);
    var step = total % 100 === 0 ? 100 : 1; // строки для клиента - ровными суммами
    var subtotal = d > 0 ? ceilTo(total / (1 - d), step) : total;
    var prepayPct = Math.min(100, Math.max(0, num(pr.prepayPct)));
    var prepaySum = Math.min(total, ceilTo(total * prepayPct / 100, pr.roundTo));

    // Доля каждого изделия в общих материалах - по площади (длине) деталей и по своей фурнитуре.
    var clientLines = [], weights = [];
    var matSum = {}, matQty = {}, edgeSum = {}, edgeQty = {};
    b.materials.forEach(function (m) { matSum[m.id] = m.sum; matQty[m.id] = m.kind === "length" ? m.length : m.area; });
    b.edges.forEach(function (x) { edgeSum[x.id] = x.sum; edgeQty[x.id] = x.net; });
    var cutBase = 0;
    b.materials.forEach(function (m) { if (m.kind === "sheet" && order.catalog.materials[m.id].cut) cutBase += m.area; });
    arr(order.products).forEach(function (p) {
      var bp = b.byProduct[p.id] || { materials: {}, edges: {}, hardware: 0 }, base = bp.hardware, id;
      for (id in bp.materials) {
        if (matQty[id] > 0) base += matSum[id] * bp.materials[id] / matQty[id];
        if (cutBase > 0 && order.catalog.materials[id].kind === "sheet" && order.catalog.materials[id].cut) base += b.cutting.sum * bp.materials[id] / cutBase;
      }
      for (id in bp.edges) if (edgeQty[id] > 0) base += edgeSum[id] * bp.edges[id] / edgeQty[id];
      var sz = p.size || {};
      clientLines.push({ kind: "product", ref: p.id, name: p.name || PRODUCT_TYPES[p.type] || "Изделие", note: sz.w ? sz.w + "x" + sz.h + "x" + sz.d + " мм" : "", qty: Math.max(1, num(p.qty, 1)), unit: "шт" });
      weights.push(base * (1 + num(pr.workPct) / 100));
    });
    items.forEach(function (l) { clientLines.push({ kind: "extra", ref: l.ref, name: l.name, qty: l.qty, unit: l.unit }); weights.push(l.sum * (1 + num(pr.workPct) / 100)); });
    // Услуги (доставка, монтаж) клиент видит по своей цене, вся наценка сидит в изделиях и своих позициях.
    var showServices = servicesSum < subtotal && weights.some(function (w) { return w > 0; });
    if (showServices) {
      splitSum(subtotal - servicesSum, weights, step).forEach(function (s, i) { clientLines[i].sum = s; });
      services.forEach(function (l) { clientLines.push({ kind: "service", ref: l.ref, name: l.name, qty: l.qty, unit: l.unit, sum: l.sum }); });
    } else {
      services.forEach(function (l) { clientLines.push({ kind: "service", ref: l.ref, name: l.name, qty: l.qty, unit: l.unit }); weights.push(l.sum); });
      splitSum(subtotal, weights, step).forEach(function (s, i) { clientLines[i].sum = s; });
    }
    clientLines = clientLines.filter(function (l) { return l.sum > 0; });

    return {
      calcAt: nowIso(),
      currency: orderCurrency(order),
      lines: lines,
      materials: materials,
      work: work,
      services: servicesSum,
      cost: cost,
      markup: markup,
      clientLines: clientLines,
      subtotal: subtotal,
      discountPct: r2(d * 100),
      discountSum: subtotal - total,
      total: total,
      prepayPct: prepayPct,
      prepaySum: prepaySum,
      profit: total - cost
    };
  }
  function recalc(order) { order.quote = quote(order); return touch(order); }

  // ---------- Оплаты и прибыль ----------

  function balance(order) {
    var paid = 0, spent = 0;
    arr(order.payments).forEach(function (p) { if (isObj(p)) paid += (p.kind === "refund" ? -1 : 1) * Math.abs(num(p.amount)); });
    arr(order.expenses).forEach(function (x) { if (isObj(x)) spent += num(x.amount); });
    var q = isObj(order.quote) ? order.quote : {};
    var total = num(q.total);
    return {
      total: total,
      paid: paid,
      due: Math.max(0, total - paid),
      overpaid: Math.max(0, paid - total),
      prepayDue: Math.max(0, num(q.prepaySum) - paid),
      expenses: spent,
      profitPlan: isNum(q.profit) ? q.profit : (isNum(q.cost) ? total - q.cost : null),
      profitFact: paid - spent
    };
  }

  // ---------- Этапы ----------

  function stageName(key) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].key === key) return STAGES[i].name; return key; }
  function setStage(order, key, date) {
    order.stage = key;
    var d = date || today(), row = null;
    order.timeline = arr(order.timeline);
    order.timeline.forEach(function (t) { if (t.stage === key) row = t; });
    if (!row) { row = { stage: key }; order.timeline.push(row); }
    row.done = d;
    return touch(order);
  }
  // Ближайшая дата, к которой что-то надо сделать: напоминание или план по этапу.
  function nextDue(order) {
    var list = [];
    arr(order.reminders).forEach(function (r) { if (isObj(r) && !r.done && isDate(r.date)) list.push({ date: r.date.slice(0, 10), text: r.text || "Напоминание" }); });
    arr(order.timeline).forEach(function (t) { if (isObj(t) && !t.done && isDate(t.plan)) list.push({ date: t.plan.slice(0, 10), text: stageName(t.stage) }); });
    list.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    return list[0] || null;
  }

  // ---------- Тексты для клиента ----------

  function productSummary(order, product) {
    if (Array.isArray(product.describe) && product.describe.length) return product.describe.slice();
    var sz = product.size && product.size.w ? product.size : null, bb = sz ? null : productBounds(order, product);
    var head = (product.name || PRODUCT_TYPES[product.type] || "Изделие");
    if (sz) head += ", " + sz.w + "x" + sz.h + "x" + sz.d + " мм (ШxВxГ)";
    else if (bb) head += ", " + bb.w + "x" + bb.h + "x" + bb.d + " мм (ШxВxГ)";
    var corpus = {}, fac = {}, tops = {};
    eachPart({ products: [product] }, function (e) {
      var m = getMaterial(order, product, e.part.mat);
      if (!m || m.group === "dvp") return;
      var label = m.name + (m.decor ? ", " + m.decor : "");
      (e.part.role === "facade" ? fac : e.part.role === "countertop" ? tops : corpus)[label] = 1;
    });
    var hw = {};
    eachHardware({ products: [product] }, function (e) { var h = getHardware(order, e.line); if (h.qty > 0 && h.name && !/^крепёж|^крепеж/i.test(h.name)) hw[h.name.toLowerCase()] = 1; });
    var out = [head];
    if (Object.keys(corpus).length) out.push("Корпус: " + Object.keys(corpus).join("; "));
    if (Object.keys(fac).length) out.push("Фасады: " + Object.keys(fac).join("; "));
    if (Object.keys(tops).length) out.push("Столешница: " + Object.keys(tops).join("; "));
    if (Object.keys(hw).length) out.push("Фурнитура: " + Object.keys(hw).join(", "));
    return out;
  }

  function clientText(order) {
    var q = isObj(order.quote) ? order.quote : quote(order), t = order.terms || {}, out = [];
    arr(order.products).forEach(function (p) { out.push(productSummary(order, p).join("\n")); });
    var ex = arr(q.clientLines).filter(function (l) { return l.kind !== "product"; }).map(function (l) { return "- " + l.name; });

  function readFile(file, opts) {

  function b64urlEncode(bytes) {

      return pipe(b64urlDecode(code.slice(3)), new DecompressionStream("deflate-raw")).then(done);
    }

  }

  function toLink(order, baseUrl) {

    FORMAT: FORMAT, VERSION: VERSION, FILE_EXT: FILE_EXT,

function kitchenWalls(k) {

          if (Hu > 800) { front(m, "Фасад подъёмный нижний", 0, upY, w, Hu / 2, Du, { side: "c", at: "b" }); front(m, "Фасад подъёмный верхний", 0, upY + Hu / 2, w, Hu / 2, Du, { side: "c", at: "b" }); mk.H("lift", 2); handles += 2; }
          else { front(m, "Фасад подъёмный", 0, upY, w, Hu, Du, { side: "c", at: "b" }); mk.H("lift", 1); handles++; }
          break;
        case "u_hood": body(m, w, upTop - 360, 360, Du, 0); front(m, "Фасад над вытяжкой", 0, upTop - 360, w, 360, Du, { side: "c", at: "b" }); mk.H("lift", 1); handles++; break;
        case "u_corner": {
          body(m, w, upY, Hu, Du, 1);
          const blind = wi > 0 && ux === 0 ? CU : 0;
          if (blind) mk.P(m.parts, "Заглушка угла", "filler", "Z", blind - 40, upY + T, Du - T, 40, Hu - 2 * T, "@corpus");
          doors(m, blind, upY, w - blind, Hu, Du, "b", w - blind <= 500); break;
        }
        case "u_open": body(m, w, upY, Hu, Du, 1); break;
      }
      if (t !== "u_gap") { ledMM += w; modules.push(m); }
      ux += w;
    });
    if (ux > wall.upLen + 1) warns.push(WALL_NAME[wall.key] + ": верхний ряд выходит за стену на " + Math.round(ux - wall.upLen) + " мм.");

    // столешница и стеновая панель по стене
    if (spans.length) {
      const run = mk.module("wall-run", WALL_NAME[wall.key] + ": столешница", wall, 0, { w: wall.len, h: topId, d: 600 });
      spans.forEach((s, si) => {
        const len = s.x1 - s.x0;
        mk.P(run.parts, "Столешница", "countertop", "Y", s.x0, TOP_Y, 0, len, 600, "@top", { grain: "a" });
        if (o.apron) {
          const ext = wall.next && si === spans.length - 1 && Math.abs(s.x1 - wall.lowLen) < 2 ? CL - 6 : 0;
          mk.P(run.parts, "Стеновая панель", "apron", "Z", s.x0, TOP_Y + topId, 0, len + ext, GAP, "@apron", { grain: "a" });
        }
      });
      modules.push(run);
    }
  });

  if (!hasSink) warns.push("Нет модуля под мойку.");
  // фурнитура
  if (o.handles === "gola") mk.H("gola", Math.ceil((golaMM + ledMM) / 100) / 10);
  else if (o.handles === "push") mk.H("push", handles);
  else if (hItem) mk.H(null, handles, { name: "Ручка: " + hItem.name, unit: "шт", price: hItem.price });
  else mk.H("handle", handles);
  mk.H(null, Math.ceil(plinthMM / 100) / 10, { name: "Цоколь кухни", unit: "м", price: cp(k, 2500, RUB.plinth) });
  const cuts = (hasSink ? 1 : 0) + (hasHob && o.stove === "builtin" ? 1 : 0);
  if (cuts) mk.H(null, cuts, { name: "Вырез под мойку / варочную панель", unit: "шт", price: cp(k, 5000, RUB.cutout) });
  if (o.led && ledMM) { mk.H("led", Math.ceil(ledMM / 100) / 10); mk.H("ledpow", 1); }

  const bx = walls.some(w => w.key === "right") ? k.len.back : Math.max(k.len.back || 0, 600);
  const size = { w: k.shape === "Ll" ? Math.max(k.len.back, 600) : bx, h: upTop, d: Math.max(600, k.shape !== "I" ? Math.max(walls.find(w => w.key === "left") ? k.len.left : 0, walls.find(w => w.key === "right") ? k.len.right : 0) : 600) };
  return { modules, warns, size, upTop, upY, Ht, walls, lay, topMM };
}

const KUPE_FILL = {
  shelves: { name: "Полки", shelves: 5, rod: false, drawers: 0 },
  rod:     { name: "Штанга", shelves: 1, rod: true, drawers: 0 },
  rodDr:   { name: "Штанга и ящики", shelves: 0, rod: true, drawers: 2 },
  shDr:    { name: "Полки и ящики", shelves: 3, rod: false, drawers: 3 }
};
const DOOR_FILL = { ldsp: "ЛДСП", mirror: "Зеркало", glass: "Цветное стекло", combo: "ЛДСП + зеркало" };
const KUPE_KIND = { korp: "Корпусный", semi: "К одной стене", built: "Встроенный в нишу" };
const PROF = { eco: "эконом", std: "стандарт", prem: "премиум" };

function kupeGeom(q) {
  const T = 16, BASE = 80, BK = 4;
  const W = q.W, H = q.H, D = q.D, m = q.doors.length;
  const sides = q.kind === "korp" ? 2 : q.kind === "semi" ? 1 : 0, roof = q.kind !== "built";
  const x0 = sides >= 1 ? T : 0, inW = W - sides * T, Dk = D - 100;
  const n = q.sections.length, secW = (inW - T * (n - 1)) / n;
  const yb = BASE + T, yt = roof ? H - T : H;
  const doorW = m > 1 ? (inW + 25 * (m - 1)) / m : inW, doorY = yb + 6, doorH = yt - yb - 12;
  const doorRects = q.doors.map((f, j) => ({ fill: f, x: x0 + (m > 1 ? j * (inW - doorW) / (m - 1) : 0), y: doorY, w: doorW, h: doorH, z: Dk + BK + 22 + (j % 2) * 38 }));
  return { T, BASE, BK, W, H, D, m, sides, roof, x0, inW, Dk, n, secW, yb, yt, doorRects };
}

function buildKupe(q, mk) {
  const g = kupeGeom(q), { T, BASE, BK, W, H, x0, inW, Dk, n, secW, yb, yt } = g;
  const parts = [], P = (...a) => mk.P(parts, ...a), warns = [], rods = [];
  if (g.sides >= 1) P("Боковина левая", "side", "X", 0, 0, BK, H, Dk);
  if (g.sides >= 2) P("Боковина правая", "side", "X", W - T, 0, BK, H, Dk);
  if (g.roof) P("Крыша", "top", "Y", x0, H - T, BK, inW, Dk);
  P("Дно", "bottom", "Y", x0, BASE, BK, inW, Dk);
  P("Цоколь", "plinth", "Z", x0, 0, Dk - 40, inW, BASE, "@corpus");
  for (let i = 1; i < n; i++) P("Перегородка " + i, "partition", "X", x0 + i * (secW + T) - T, yb, BK, yt - yb, Dk);
  let drawersN = 0, rodM = 0;
  q.sections.forEach((key, i) => {
    const s = KUPE_FILL[key] || KUPE_FILL.shelves, sx = x0 + i * (secW + T), DH = 200;
    let y = yb;
    for (let d = 0; d < s.drawers; d++) {
      const yy = yb + d * DH, bw = secW - 26, bd = Dk - 80;
      P("Фасад ящика", "drawer", "Z", sx + 2, yy + 2, BK + Dk - T - 20, secW - 4, DH - 4, "@corpus");
      P("Ящик: бок", "drawer", "X", sx + 13, yy + 30, BK + 20, DH - 70, bd);
      P("Ящик: бок", "drawer", "X", sx + 13 + bw - T, yy + 30, BK + 20, DH - 70, bd);
      P("Ящик: перед", "drawer", "Z", sx + 13 + T, yy + 30, BK + 20 + bd - T, bw - 2 * T, DH - 70, "@corpus");
      P("Ящик: зад", "drawer", "Z", sx + 13 + T, yy + 30, BK + 20, bw - 2 * T, DH - 70, "@corpus");
      P("Ящик: дно", "drawer", "Y", sx + 13, yy + 27, BK + 20, bw, bd, "@back");
      drawersN++;
    }
    if (s.drawers) { y = yb + s.drawers * DH; P("Полка над ящиками", "shelf", "Y", sx, y, BK, secW, Dk - 20); y += T; }
    let top = yt;
    if (s.rod) {
      const hat = yt - 320;
      P("Полка верхняя", "shelf", "Y", sx, hat, BK, secW, Dk - 20);
      rods.push({ x: sx, y: hat - 70, z: BK + Dk / 2, len: secW }); rodM += secW / 1000;
      top = hat - 1050;
      if (top - y < 0 && s.drawers) warns.push("Секция " + (i + 1) + ": под штангой мало места для одежды.");
    }
    const cnt = s.rod ? Math.min(s.shelves, Math.max(0, Math.floor((top - y) / 300))) : s.shelves;
    for (let j = 1; j <= cnt; j++) P("Полка", "shelf", "Y", sx, Math.round(y + (top - y) * j / (cnt + (s.rod ? 0 : 1)) - (s.rod ? T : T / 2)), BK, secW, Dk - 20);
    if (secW > 1000) warns.push("Секция " + (i + 1) + ": ширина " + Math.round(secW) + " мм - полки будут прогибаться.");
  });
  if (q.back !== false) {
    const nb = Math.ceil((W - 4) / 1690);
    for (let i = 0; i < nb; i++) P("Задняя стенка", "back", "Z", 2 + i * (W - 4) / nb, BASE, 0, (W - 4) / nb, H - BASE - 2, "@back");
  }
  g.doorRects.forEach((d, j) => {
    const px = 26, py = 36, iw = d.w - 2 * px, ih = d.h - 2 * py, nm = "Дверь " + (j + 1) + ": ";
    const fz = t => d.z + (16 - t) / 2;
    if (d.fill === "combo") {
      const h1 = Math.round(ih * 0.5);
      P(nm + "вставка ЛДСП", "facade", "Z", d.x + px, d.y + py, fz(16), iw, h1 - 6, "@facade", { door: j });
      P(nm + "зеркало", "facade", "Z", d.x + px, d.y + py + h1 + 6, fz(4), iw, ih - h1 - 6, "@mirror", { door: j });
    } else P(nm + (d.fill === "mirror" ? "зеркало" : d.fill === "glass" ? "стекло" : "вставка ЛДСП"), "facade", "Z", d.x + px, d.y + py, fz(d.fill === "ldsp" ? 16 : 4), iw, ih, d.fill === "mirror" ? "@mirror" : d.fill === "glass" ? "@glass" : "@facade", { door: j });
    if (d.w > 1050) warns.push("Дверь шире 1 м - тяжело двигать, лучше добавить ещё одну дверь.");
  });
  mk.H("prof-" + (q.prof || "std"), g.m);
  mk.H("guide", drawersN);
  mk.H("rod", Math.ceil(rodM * 10) / 10);
  mk.H(null, 1, { name: "Крепёж и опоры", unit: "компл", price: cp(q, 6000, RUB.kupeMisc) });
  return { parts, warns, rods, geom: g, size: { w: W, h: H, d: q.D } };
}

function adoptOrder(order) {
  const roles = {};
  (order.products || []).forEach(pr => {
    pr.finish = pr.finish || {};
    const each = part => {
      if (typeof part.mat !== "string" || part.mat[0] === "@") return;
      const m = order.catalog.materials[part.mat]; if (!m) return;
      let role = null;
      if (part.role === "countertop" || m.group === "top") role = "top";
      else if (part.role === "facade" && m.group !== "glass") role = "facade";
      else if (m.group === "ldsp") role = "corpus";
      if (!role) return;
      if (!pr.finish[role]) pr.finish[role] = part.mat;
      if (pr.finish[role] === part.mat) part.mat = "@" + role;
    };
    (pr.parts || []).forEach(each); (pr.modules || []).forEach(m => (m.parts || []).forEach(each));
    Object.keys(pr.finish).forEach(r => roles[r] = 1);
  });
  return roles;
}

function b64u(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

async function pack(prefix, obj) {

}

function cfgOf(withClient) {

async function openCode(text) {
  text = String(text || "").trim();
  if (!text) throw new Error("Вставьте код или текст заказа.");
  if (text[0] === "{" || text[0] === "[") {
    const data = JSON.parse(text);
    if (data && data.v === 1 && data.type && !data.format) { applyCfg(data); return "Проект открыт"; }
    const res = MO.parse(data), one = Array.isArray(res) ? res[0] : res;
    if (!one.order.products.length || !MO.listParts(one.order).some(e => typeof e.part.x === "number")) throw new Error("В этом заказе нет деталей с координатами - показать его в 3D не получится.");
    adopt(one.order); return "Заказ открыт";
  }
  const m = /(?:^|[^A-Za-z0-9])([cemj][01]\.[A-Za-z0-9_-]{8,})/.exec(" " + text);
  if (!m) throw new Error("Не нашли код проекта. Он начинается с c1. или m1.");
  const code = m[1];
  if (code[0] === "c") { applyCfg(await unpack(code)); return "Проект открыт"; }
  if (code[0] === "e") {
    const d = await unpack(code);
    if (S.type !== "ext" || S.ext.id !== d.id) throw new Error("Сначала откройте заказ, к которому относится этот код.");
    S.extFin = d.fin || {}; if (d.client) S.client = merge(S.client, d.client); return "Выбор клиента применён";
  }

}

async function refreshReq() {
  try { reqCode = await projectCode(true); } catch (e) { reqCode = ""; }
  if (reqCode.length > 1800) reqCode = "";
  const text = requestText(reqCode);
  if (!$("reqSum")) return;
  $("reqSum").textContent = requestText("");
  $("waLink").href = "https://wa.me/" + MO.waPhone(S.studio.wa) + "?text=" + encodeURIComponent(text);
}
let reqT = 0;
function sheetField(t) {
  if (sheetKind === "send") { S.client[t.dataset.f] = t.value; save(); clearTimeout(reqT); reqT = setTimeout(refreshReq, 250); }
}

// --- код от дизайнера ---
function codeSheet() {
  openSheet("code", head("Открыть проект") + '<p class="note">Вставьте сообщение или код, который прислал дизайнер. Можно вставить и файл заказа из калькулятора.</p>' +
    '<label class="f">Код или сообщение целиком<textarea id="codeIn" style="min-height:110px" placeholder="c1.xxxxx"></textarea></label>' +
    '<label class="f">Или файл заказа (*.mebel.json)<input type="file" id="codeFile" accept=".json,application/json"></label>' +
    '<div class="btns"><button class="cta" data-a="codeGo">Открыть</button></div>');
}

// --- дизайнеру ---
function proSheet() {
  pro.me = true;
  const q = cur.order.quote || {}, k = S.kitchen, kq = S.kupe;
  let h = head("Настройки дизайнера");
  h += sec("Ваши данные", "", '<div class="row2"><label class="f">Название студии<input data-p="studio.name" value="' + esc(S.studio.name) + '"></label><label class="f">Ваш WhatsApp<input data-p="studio.wa" type="tel" placeholder="+7 701 000 00 00" value="' + esc(S.studio.wa) + '"></label></div>' +
    '<div class="row2"><label class="f">Наценка, %<input data-p="markup" type="number" min="0" max="300" value="' + S.markup + '"></label><label class="f">Цена для клиента<select data-p="showPrice"><option value="1"' + (S.showPrice ? " selected" : "") + '>Показывать</option><option value="0"' + (S.showPrice ? "" : " selected") + ">Скрыть</option></select></label></div>" +
    '<div class="row2"><label class="f">Валюта цен<select data-p="cur">' + Object.values(MO.CURRENCIES).map(c => '<option value="' + c.code + '"' + (c.code === S.cur ? " selected" : "") + '>' + esc(c.name) + ', ' + esc(c.sign) + '</option>').join("") + '</select></label><p class="note" style="align-self:end;margin:0">Цены материалов - стартовые для этой валюты. Код для клиента передаёт и валюту.</p></div>');
  if (S.type === "kitchen") {
    const W = kitchenWalls(k), lay = kitchenLayout(k);
    h += sec("Точные размеры, мм", "", '<div class="row3">' + W.map(w => '<label class="f">' + WALL_NAME[w.key] + '<input type="number" data-p="k.len.' + w.key + '" value="' + w.len + '"></label>').join("") + "</div>");
    h += sec("Модули", k.manual ? "расставлены вручную" : "расставлены автоматически", W.map((w, wi) => {
      const row = lay[wi], lo = row.lower.reduce((s, m) => s + (+m.w || 0), 0);
      const talls = row.lower.filter(m => (LOWER[m.t] || {}).tall).reduce((s, m) => s + m.w, 0), up = row.upper.reduce((s, m) => s + (+m.w || 0), 0) + talls;
      const mods = (list, defs, kind) => '<div class="mods">' + list.map((m, i) => '<div class="mod"><select data-p="mod.' + wi + "." + kind + "." + i + '.t" aria-label="Тип модуля">' + Object.keys(defs).map(t => '<option value="' + t + '"' + (t === m.t ? " selected" : "") + ">" + defs[t].name + "</option>").join("") + '</select><input type="number" data-p="mod.' + wi + "." + kind + "." + i + '.w" value="' + m.w + '" aria-label="Ширина, мм"><button class="x" data-a="modDel" data-w="' + wi + '" data-kind="' + kind + '" data-i="' + i + '" aria-label="Удалить модуль">×</button></div>').join("") + '<button class="linkbtn" data-a="modAdd" data-w="' + wi + '" data-kind="' + kind + '">+ модуль</button></div>';
      return '<div class="wallbox"><div class="wh">' + WALL_NAME[w.key] + ", низ<span class=\"" + (Math.abs(lo - w.lowLen) >= 50 ? "bad" : "") + '">занято ' + lo + " из " + w.lowLen + (w.next ? " (угол 600 занимает следующая стена)" : "") + "</span></div>" + mods(row.lower, LOWER, "lower") +
        '<div class="wh">' + WALL_NAME[w.key] + ", верх<span class=\"" + (up > w.upLen + 1 ? "bad" : "") + '">занято ' + up + " из " + w.upLen + "</span></div>" + mods(row.upper, UPPER, "upper") + "</div>";
    }).join("") + (k.manual ? '<button class="linkbtn" data-a="modAuto">Расставить автоматически заново</button>' : '<p class="note">Измените любой модуль - расстановка станет ручной и перестанет подстраиваться под длину стен. Угловой модуль в начале стены: первые 600 мм закрыты соседней стеной.</p>'));
  } else if (S.type === "kupe") {
    h += sec("Точные размеры, мм", "", '<div class="row3"><label class="f">Ширина<input type="number" data-p="q.W" value="' + kq.W + '"></label><label class="f">Высота<input type="number" data-p="q.H" value="' + kq.H + '"></label><label class="f">Глубина<input type="number" data-p="q.D" value="' + kq.D + '"></label></div>' +
      '<div class="row2"><label class="f">Тип шкафа<select data-p="q.kind">' + Object.keys(KUPE_KIND).map(t => '<option value="' + t + '"' + (t === kq.kind ? " selected" : "") + ">" + KUPE_KIND[t] + "</option>").join("") + '</select></label><label class="f">Задняя стенка<select data-p="q.back"><option value="1"' + (kq.back !== false ? " selected" : "") + '>Есть (ДВП)</option><option value="0"' + (kq.back === false ? " selected" : "") + ">Нет</option></select></label></div>");
  }
  if (S.type === "kitchen") h += sec("Каталог ручек", handleList(S).length + " шт.", '<p class="note">Одна строка - одна ручка: название; цена; вид (скоба, рейлинг, кнопка, ракушка, торцевая); цвет (чёрный, хром, латунь, бронза, белый). Можно скопировать столбцы прямо из прайса магазина в Excel. Длину берём из названия ("160 мм").</p><label class="f">Список ручек<textarea id="catIn" style="min-height:150px;font-size:13px">' + esc(handlesText(handleList(S))) + '</textarea></label><div class="btns"><button class="cta sec2" data-a="catSave">Обновить каталог</button><button class="cta sec2" data-a="catReset">Вернуть пример</button></div>');
  const warns = (cur.info.warns || []).concat(MO.validate(cur.order).errors.map(e => e.msg));
  if (warns.length) h += '<div class="warn"><b>Проверьте:</b><ul>' + warns.slice(0, 8).map(w => "<li>" + esc(w) + "</li>").join("") + "</ul></div>";
  if (q.total) h += '<div class="info">Себестоимость ' + money(q.cost || 0) + " · наценка " + money(q.markup || 0) + " · клиенту " + money(q.total) + ". Цены материалов примерные, как в калькуляторе.</div>";
  h += sec("Работа вместе с клиентом", "", (S.type === "ext" ? "" : '<div class="chips">' + toggle("lock", "Закрепить размеры: клиент меняет только отделку", S.lock) + "</div>") +
    '<p class="note">Задайте размеры, закрепите их и отправьте клиенту код. Клиент на этой же странице нажмёт "Есть код", подберёт цвета и пришлёт заявку вам в WhatsApp. Можно и проще: закрепить размеры и дать клиенту свой телефон или планшет.</p>' +
    '<div class="code" id="proCode">...</div><div class="btns"><button class="cta" data-a="copyCode">Скопировать код для клиента</button><button class="cta sec2" data-a="copyOrder">Скопировать заказ (JSON)</button></div>' +
    '<p class="note">Заказ (JSON) - это общий формат проекта: его открывают калькулятор, КП, раскрой и учёт заказов.</p>');
  h += sec("Открыть чужой проект", "", '<p class="note">Заявка клиента, заказ из калькулятора или файл *.mebel.json - кнопка "Есть код" вверху страницы.</p><button class="linkbtn" data-a="resetAll">Сбросить всё и начать заново</button>');
  const st = $("card").scrollTop, was = sheetKind === "pro";
  openSheet("pro", h, true); if (was) $("card").scrollTop = st;
  projectCode(false).then(c => { if ($("proCode")) $("proCode").textContent = c; });
}
function manualize() { const k = S.kitchen; if (!k.manual) k.manual = JSON.parse(JSON.stringify(kitchenLayout(k))); return k.manual; }
function proField(t) {
  const p = t.dataset.p.split("."), v = t.value;
  if (p[0] === "studio") S.studio[p[1]] = v;
  else if (p[0] === "markup") S.markup = Math.max(0, Math.min(300, +v || 0));
  else if (p[0] === "showPrice") S.showPrice = v === "1";
  else if (p[0] === "cur") { S.cur = v; if (S.handleCat) toast("Цены в вашем каталоге ручек остались как были - проверьте их"); }
  else if (p[0] === "k") S.kitchen.len[p[2]] = Math.max(1000, Math.min(8000, Math.round(+v) || 2400));
  else if (p[0] === "q") { if (p[1] === "kind") S.kupe.kind = v; else if (p[1] === "back") S.kupe.back = v === "1"; else { S.kupe[p[1]] = +v; sanitize(); fitKupe(); } }
  else if (p[0] === "mod") { const m = manualize()[+p[1]][p[2]][+p[3]]; if (p[4] === "t") { m.t = v; delete m.what; } else m.w = Math.max(150, Math.min(1400, Math.round(+v) || 600)); }
  render(); rebuild(p[0] === "k" || p[0] === "q"); proSheet();
}
function sheetAction(a, b) {
  switch (a) {
    case "close": closeSheet(); break;
    case "copyReq": copyText(requestText(reqCode), "Заявка скопирована"); break;
    case "codeGo": {
      const f = $("codeFile").files[0];
      (f ? f.text() : Promise.resolve($("codeIn").value)).then(openCode).then(msg => { closeSheet(); render(); rebuild(true); toast(msg); }).catch(e => toast(e.message || "Не получилось открыть"));
      break;
    }
    case "lock": S.lock = !S.lock; render(); rebuild(); proSheet(); break;
    case "copyCode": projectCode(false).then(c => copyText(c, "Код скопирован - отправьте его клиенту")); break;
    case "copyOrder": copyText(MO.stringify(cur.order), "Заказ скопирован"); break;
    case "modDel": manualize()[+b.dataset.w][b.dataset.kind].splice(+b.dataset.i, 1); render(); rebuild(); proSheet(); break;
    case "modAdd": manualize()[+b.dataset.w][b.dataset.kind].push(b.dataset.kind === "lower" ? { t: "shelf", w: 600 } : { t: "u_shelf", w: 600 }); render(); rebuild(); proSheet(); break;
    case "catSave": { const L = parseHandles($("catIn").value); if (!L.length) { toast("Не нашли ни одной ручки с ценой"); break; } S.handleCat = L; S.kitchen.opts.handle = L[0].id; render(); rebuild(); proSheet(); toast("В каталоге " + L.length + " ручек"); break; }
    case "catReset": S.handleCat = null; S.kitchen.opts.handle = "h1"; render(); rebuild(); proSheet(); break;
    case "modAuto": S.kitchen.manual = null; render(); rebuild(); proSheet(); break;
    case "resetAll": { const st = S.studio; S = defaultState(); S.studio = st; S.orderId = MO.uid("o"); tab = 0; closeSheet(); render(); rebuild(true); toast("Начали заново"); break; }
  }
}

// ---------- кнопки сцены ----------
$("btnSend").onclick = sendSheet;
$("btnCode").onclick = codeSheet;
$("btnPro").onclick = proSheet;
$("tFit").onclick = () => View.fit(null, true);
$("tOpen").onclick = () => { if (tab === 2) tab = 1; else openDoors = !openDoors; render(); rebuild(); };
$("tShot").onclick = () => { const s = View.snapshot(); if (!s) return toast("3D ещё загружается"); openSheet("shot", head("Картинка проекта") + '<img class="shot" src="' + s + '" alt="Ваш проект"><p class="note">Нажмите на картинку и удерживайте, чтобы сохранить её или отправить. На компьютере - правая кнопка мыши, "Сохранить картинку".</p>'); };
$("tPan").onclick = () => { View.panMode = !View.panMode; $("tPan").classList.toggle("on", View.panMode); $("tPan").textContent = View.panMode ? "Двигаем" : "Двигать"; };
$("tPhoto").onclick = () => {
  if (View.hasPhoto) { View.setPhoto(null); View.hasPhoto = false; View.panMode = false; $("tPhoto").textContent = "Примерить на фото"; $("tPhoto").classList.remove("on"); $("tPan").classList.add("hide"); return; }
  $("photoFile").value = ""; $("photoFile").click();
};
$("photoFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    View.setPhoto(img); View.hasPhoto = true; $("tPhoto").textContent = "Убрать фото"; $("tPhoto").classList.add("on"); $("tPan").classList.remove("hide"); $("tPan").classList.remove("on"); $("tPan").textContent = "Двигать";
    const hint = $("hint"); hint.textContent = "Поверните и подвиньте мебель на её место на фото"; hint.classList.remove("off"); hintArmed = performance.now() + 1500;
  };
  img.onerror = () => toast("Не получилось открыть фото");
  img.src = URL.createObjectURL(f);
};
let hintArmed = 0;
View.onMove = () => { if (performance.now() > hintArmed) $("hint").classList.add("off"); };
View.onPickMod = slot => {
  if (S.type !== "kitchen" || S.lock) return;
  const [wi, row, i] = slot.split(":"), m = (kitchenLayout(S.kitchen)[+wi] || {})[row] && kitchenLayout(S.kitchen)[+wi][row][+i];
  if (!m || !SWAP[row] || !SWAP[row].some(x => x[0] === m.t)) { toast("Этот модуль задаётся на вкладке \"Форма\""); return; }
  openSheet("swap", head((row === "lower" ? "Нижний шкаф " : "Верхний шкаф ") + cm(m.w)) + '<p class="note">Что сделать на этом месте?</p><div class="chips">' + SWAP[row].map(x => '<button class="chip' + (x[0] === m.t ? " on" : "") + '" data-a="swap" data-slot="' + slot + '" data-v="' + x[0] + '">' + x[1] + "</button>").join("") + "</div>");
};
View.onPick = j => { if (S.type !== "kupe") return; selDoor = j; tab = 1; openDoors = false; render(); rebuild(); };

// ---------- запуск ----------
loadState();
if (/[#&](order|cfg)=/.test(location.hash)) {
  const m = /[#&](?:order|cfg)=([A-Za-z0-9._-]+)/.exec(location.hash);
  openCode(m[1]).then(() => { render(); rebuild(true); }).catch(() => {});
}
cur = S.type === "ext" ? null : buildOrder(S);
render();
rebuild(true);
View.init($("stage")).then(() => { $("load").remove(); rebuild(true); }).catch(e => {
  console.error(e);
  $("load").innerHTML = "3D-модель не загрузилась. Проверьте интернет и обновите страницу.<br>Цвета, цену и заявку можно собрать и без неё.";
});

// Конфигуратор (вклеивается внутрь его модуля, поэтому видит S, cur, adopt, render...).
if (window.MebelSite) MebelSite.register({
  mount: "header",
  get: function () { return cur && cur.order ? cur.order : (S.type === "ext" ? S.ext : null); },
  put: function (o) {
    if (!o.products || !o.products.length || !MO.listParts(o).some(function (e) { return typeof e.part.x === "number"; }))
      throw new Error("В этом заказе нет деталей с координатами - показать его в 3D не получится");
    closeSheet(); adopt(o); render(); rebuild(true);
  },
  empty: "Проект ещё собирается, попробуйте через секунду",
  extra: [{
    label: "Скопировать ссылку для клиента (с этим проектом)",
    run: async function () {
      // чужой заказ отдаём клиенту без себестоимости и закупочных цен
      const code = S.type === "ext" ? await MO.encode(MO.forClient(S.ext)) : await projectCode(false);
      copyText(location.origin + location.pathname + "#cfg=" + code, "Ссылка скопирована - отправьте её клиенту в WhatsApp");
    }
  }, {
    label: "Скопировать ссылку на чистый конфигуратор",
    run: function () { copyText(location.origin + location.pathname, "Ссылка скопирована"); }
  }]
});

})();
</script>
</body>
</html>
